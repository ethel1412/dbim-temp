<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shillong Custom House | Commissionerate of Customs (Preventive) North Eastern Region, Shillong | Photo Gallery</title>
    <link href="../assets/css/boostrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="../assets/css/footer.css" rel="stylesheet">
    <link href="assets/css/accessibility-style.css" rel="stylesheet">
    <link href="assets/css/photo.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Header -->
    <div id="header" data-include="components/header.html"></div>

    <!--Navigation-->
    <div class="banner">
      <div class="banner_inner">
        <div class="banner_content">
          <div class="banner_logo">
            <p class="fw-bold fs-4">Photo Gallery</p>
          </div>
          <div>
            <a href="index.html">Home</a> &raquo; <span><a href="photo-gallery.html">Photo Gallery</a></span>
          </div>
        </div>
      </div>
    </div> 

  <main id="main-Content" tabindex="-1">
    <section class="waw">
      <div class="custom-container position-relative">
        <div class="waw-inner d-flex position-relative">
          <div class="waw-left position-relative">
            <div class="explore_head text-center">
              <h1><span>Photo Gallery</span></h1>
            </div>
            <section class="gallery-section">
              <div class="row-gallery">
                <a href="#" class="row-card album-card" data-album="sensatisation">
                  <div class="thumb">
                    <img src="photogallery/sensatisation/P-11.jpeg" alt="">
                  </div>
                  <div class="caption">Sensatisation</div>
                </a>
                
                <a href="#" class="row-card album-card" data-album="new_milestone">
                  <div class="thumb">
                    <img src="photogallery/new_milestone/DSC_0112.jpg" alt="">
                  </div>
                  <div class="caption">New Milestone</div>
                </a>
                
                <a href="#" class="row-card album-card" data-album="international_customs_day">
                  <div class="thumb">
                    <img src="photogallery/international_customs_day/DSC_0058.jpg" alt="">
                  </div>
                  <div class="caption">International Customs Day</div>
                </a>
                
                <a href="#" class="row-card album-card" data-album="ID_parade">
                  <div class="thumb">
                    <img src="photogallery/ID_parade/IMGP6896.jpg" alt="">
                  </div>
                  <div class="caption">ID Parade</div>
                </a>
                
                <a href="#" class="row-card album-card" data-album="gold_seizure">
                  <div class="thumb">
                    <img src="photogallery/gold_seizure/DSC04310.jpg" alt="">
                  </div>
                  <div class="caption">Gold Seizure</div>
                </a>
                
                <a href="#" class="row-card album-card" data-album="ganja_seizure">
                  <div class="thumb">
                    <img src="photogallery/ganja_seizure/DSC_0081.jpg" alt="">
                  </div>
                  <div class="caption">Ganja Seizure</div>
                </a>
                
              </div>

              <button id="backToAlbums" class="btn btn-secondary mb-3" style="display:none;">
                ← Back to Albums
              </button>

              <div id="pageAlbumGrid" class="album-grid mt-4"></div>
                <div class="modal fade" id="imageModal" tabindex="-1">
                  <div class="modal-dialog modal-xl modal-dialog-centered">
                    <div class="modal-content bg-dark text-white">
                
                      <button class="btn-close btn-close-white ms-auto m-2"
                              data-bs-dismiss="modal"></button>
                
                      <div class="modal-body text-center position-relative">
                
                        <button class="modal-nav prev">❮</button>
                
                        <img id="modalImage"
                            class="img-fluid rounded">
                
                        <button class="modal-nav next">❯</button>
                
                      </div>
                    </div>
                  </div>
                </div>
            </section>
            </div>
            </div>
            </div>
            </div>
    </section>    
  </main>

   <!-- Footer -->
 <div data-include="components/footer.html"></div>

    <script src="assets/js/menu.js"></script>
    <script src="assets/js/navbar_scroll.js"></script>
    <script src="assets/js/accessibility.js"></script>
    <script src="assets/js/weights.js"></script>
</body>
</html>
